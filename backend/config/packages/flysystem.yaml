# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        # roadmap Phase 15.2: local-disk adapter (CLAUDE.md — no cloud
        # storage). Lives under public/ deliberately, not var/storage/ —
        # Caddy (frankenphp/Caddyfile) serves any existing file under
        # public/ directly, so a gym's logo needs no dedicated download
        # controller, just a path the frontend can <img src> as-is.
        gym_logos.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/public/uploads/gym-logos'

        # roadmap Phase 17 / functional requirements §15.1: "stored as a
        # simple file upload — no automated categorization or text
        # extraction." Same local-disk-under-public/ pattern as
        # gym_logos.storage above, for the same reason (no dedicated
        # download controller needed).
        expense_receipts.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/public/uploads/expense-receipts'

        # setly-phase-exercise-media.md §3/§6: platform-wide catalog media,
        # written once by ImportExercisesCommand (never a user upload) —
        # under public/media/ rather than public/uploads/ to keep "imported
        # reference data" visually distinct from user-uploaded content in
        # the same tree, and to match the /media/exercises/* path the
        # Caddyfile's immutable-cache header block matches on.
        exercise_media.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/public/media/exercises'
