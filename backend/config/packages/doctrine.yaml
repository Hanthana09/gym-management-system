doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
        mapping_types:
            uuid: uuid
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # setly-phase-exercise-media.md §3/§5: primary_muscles/secondary_muscles
        # are JSON arrays; filtering "is X in this array" has no DQL-native
        # operator, so this registers Postgres's own `jsonb_exists()` as a
        # DQL function — the idiomatic Doctrine way to use a platform-specific
        # SQL operator inside a DQL query (vs. hand-writing raw SQL per
        # call site). Used by ExerciseRepository::findFilteredIds() and
        # WorkoutScheduleExerciseRepository's scoped muscle filter.
        dql:
            string_functions:
                JSONB_EXISTS: App\Doctrine\JsonbExistsFunction
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
