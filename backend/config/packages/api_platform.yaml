api_platform:
    title: 'Hello API Platform'
    version: 1.0.0
    formats:
        jsonld:
            - application/ld+json
        # Available on request (Accept: application/json) alongside the
        # default jsonld — a flat array/object, no hydra envelope.
        # Deliberately NOT listed first: jsonld stays the default so
        # frontend/exercises' existing {member, totalItems} consumption
        # (the one other real API Platform integration in this app) is
        # completely unaffected; only a caller that explicitly asks for
        # `application/json` (gym-management-dashboard-redesign.md
        # Phase 0's notification list) gets the flat shape.
        json:
            - application/json
        jsonapi:
            - application/vnd.api+json
        hal:
            - application/hal+json
        html:
            - text/html
    enable_swagger_ui: true
    enable_re_doc: true
    enable_scalar: true
    defaults:
        route_prefix: api
        stateless: true
        cache_headers:
            vary: [Content-Type, Authorization, Origin]
