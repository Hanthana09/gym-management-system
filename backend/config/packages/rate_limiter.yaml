framework:
    rate_limiter:
        # Functional requirements §1.2 / architecture §9: max 3 OTP requests
        # per 10 minutes, keyed by destination+IP in the controller.
        otp_request:
            policy: 'sliding_window'
            limit: 3
            interval: '10 minutes'

        # Functional requirements §1.1: max 5 failed password attempts per
        # 15 minutes, keyed by account (email) in the controller.
        login_attempts:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        # gym-management-password-auth.md §6: forgot-password, keyed by
        # identifier and separately by IP — the WhatsApp 250-conversation/day
        # cap makes unrestricted retries especially costly here.
        forgot_password_identifier:
            policy: 'sliding_window'
            limit: 3
            interval: '15 minutes'

        forgot_password_ip:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'

        # gym-management-password-auth.md §6: reset-password, keyed by
        # identifier, to prevent token brute-forcing.
        reset_password:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
